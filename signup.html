<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — EPMS</title>
<meta name="description" content="Create your EPMS account and start managing engineering projects.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">
  <form class="card" action="dashboard.html">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40">EPMS</a>
    <h1 style="font-size:1.5rem;margin-bottom:4px">Create your account</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:0">Free during open beta · No credit card required</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px">
      <div>
        <label for="fn">First name</label>
        <input id="fn" type="text" placeholder="Sana" autocomplete="given-name" required>
      </div>
      <div>
        <label for="ln">Last name</label>
        <input id="ln" type="text" placeholder="Khan" autocomplete="family-name" required>
      </div>
    </div>
    <label for="e">Work email</label>
    <input id="e" type="email" placeholder="you@company.com" autocomplete="email" required>
    <label for="p">Password</label>
    <input id="p" type="password" placeholder="8+ characters" autocomplete="new-password" required>
    <label for="r">Your role</label>
    <select id="r">
      <option>Admin</option>
      <option>Project Manager</option>
      <option selected>Team Member</option>
    </select>
    <p style="font-size:13px;color:var(--muted);margin-top:8px;margin-bottom:0">
      By signing up you agree to our <a href="#" style="color:var(--b600)">Terms of Service</a> and <a href="#" style="color:var(--b600)">Privacy Policy</a>.
    </p>
    <p style="margin-top:14px"><button class="btn pri" style="width:100%" type="submit"><i class="bi bi-person-plus"></i>Create account</button></p>
    <div class="divider">or</div>
    <p class="auth-links">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</main>
</body>
</html>
