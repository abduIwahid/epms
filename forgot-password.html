<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — EPMS</title>
<meta name="description" content="Reset your EPMS password.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">
  <!-- Step 1: enter email -->
  <form class="card" id="reset-form" action="#sent">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40">EPMS</a>
    <h1 style="font-size:1.5rem;margin-bottom:4px">Forgot your password?</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:0">Enter your email and we'll send a reset link.</p>
    <label for="e">Email address</label>
    <input id="e" type="email" placeholder="you@company.com" autocomplete="email" required>
    <p style="margin-top:14px"><button class="btn pri" style="width:100%" type="submit"><i class="bi bi-envelope-arrow-up"></i>Send reset link</button></p>
    <p class="auth-links" style="margin-top:12px"><a href="login.html"><i class="bi bi-arrow-left"></i> Back to log in</a></p>
  </form>

  <!-- Step 2: confirmation card (shown via :target) -->
  <div class="card" id="sent" style="display:none;width:100%;max-width:420px;box-shadow:var(--sh2)">
    <div style="text-align:center;padding:8px 0 16px">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;font-size:32px;color:var(--green-ink);margin:0 auto 16px">
        <i class="bi bi-envelope-check"></i>
      </div>
      <h1 style="font-size:1.4rem;margin-bottom:8px">Check your inbox</h1>
      <p style="color:var(--muted);font-size:15px;margin:0">We've sent a reset link to <strong>you@company.com</strong>. It expires in 30 minutes.</p>
    </div>
    <a href="login.html" class="btn pri" style="width:100%;justify-content:center;margin-top:8px"><i class="bi bi-box-arrow-in-right"></i>Back to log in</a>
    <p class="auth-links" style="margin-top:12px">Didn't get it? <a href="forgot-password.html">Resend</a></p>
  </div>
</main>
<style>
  /* Show confirmation card when #sent is :target */
  #sent:target { display:block }
  #sent:target ~ #reset-form, #reset-form:has(~ #sent:target) { display:none }
</style>
</body>
</html>
