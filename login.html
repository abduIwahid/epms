<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — EPMS</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth">
  <form class="card" action="dashboard.html">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40">EPMS</a>
    <h1 style="font-size:1.5rem">Log in to your workspace</h1>
    <label for="e">Email</label><input id="e" type="email" placeholder="you@company.com" autocomplete="email" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <label for="r">Role</label>
    <select id="r"><option>Admin</option><option>Project Manager</option><option selected>Team Member</option></select>
    <p><button class="btn pri" style="width:100%" type="submit"><i class="bi bi-box-arrow-in-right"></i>Log in</button></p>
    <p style="font-size:14px;color:var(--muted);margin:0">New here? <a href="login.html">Create an account</a> · <a href="login.html">Forgot password</a></p>
  </form>
</main>
</body>
</html>
